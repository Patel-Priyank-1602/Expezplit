# Prometheus Configuration — Expezplit Monitoring (§9.1)
#
# Scrapes metrics from all Expezplit services.
# Each service exposes a /metrics endpoint via prom-client.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:4000"]
        labels:
          service: "api-gateway"
    metrics_path: /metrics

  - job_name: "sse-gateway"
    static_configs:
      - targets: ["sse-gateway:4001"]
        labels:
          service: "sse-gateway"
    metrics_path: /metrics

  - job_name: "worker"
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: "worker"
    metrics_path: /metrics

  - job_name: "email-service"
    static_configs:
      - targets: ["email-service:3001"]
        labels:
          service: "email-service"
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
