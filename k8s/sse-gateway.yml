# SSE Gateway — Deployment + Service + Ingress with sticky sessions (§4.3)
# SSE connections are long-lived, so the Ingress routes a client
# back to the same pod via cookie-based affinity.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sse-gateway
  namespace: expezplit-prod
  labels:
    app: sse-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sse-gateway
  template:
    metadata:
      labels:
        app: sse-gateway
    spec:
      containers:
        - name: sse-gateway
          image: your-registry/expezplit-sse-gateway:latest
          ports:
            - containerPort: 4001
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          envFrom:
            - secretRef:
                name: expezplit-secrets
          env:
            - name: SSE_PORT
              value: "4001"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4001
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sse-gateway
  namespace: expezplit-prod
spec:
  selector:
    app: sse-gateway
  ports:
    - port: 4001
      targetPort: 4001
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sse-ingress
  namespace: expezplit-prod
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: events.expezplit.app
      http:
        paths:
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: sse-gateway
                port:
                  number: 4001
