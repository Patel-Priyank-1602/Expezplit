# Worker — Deployment + KEDA ScaledObject (§4.2)
# Workers scale based on queue depth (Redis list length), not just CPU,
# since email/CSV jobs are bursty rather than CPU-bound.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: expezplit-prod
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: your-registry/expezplit-worker:latest
          ports:
            - containerPort: 9100
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          envFrom:
            - secretRef:
                name: expezplit-secrets
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: DASHBOARD_PORT
              value: "9100"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: expezplit-prod
spec:
  selector:
    app: worker
  ports:
    - port: 9100
      targetPort: 9100
      protocol: TCP
  type: ClusterIP
