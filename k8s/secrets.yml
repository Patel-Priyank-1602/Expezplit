# Kubernetes Secrets Template
#
# NEVER commit this file with real values to version control!
#
# Usage:
# 1. Replace placeholder values with base64-encoded real values:
#    echo -n "your-value" | base64
# 2. Apply: kubectl apply -f k8s/secrets.yml
#
# Or better, use kubectl directly:
#    kubectl create secret generic expezplit-secrets \
#      --namespace=expezplit-prod \
#      --from-literal=EMAIL=your-email@gmail.com \
#      --from-literal=APP_PASSWORD=your-app-password \
#      --from-literal=SENTRY_DSN=your-sentry-dsn \
#      --from-literal=EXCHANGE_RATE_API_KEY=your-api-key \
#      --from-literal=GRAFANA_ADMIN_PASSWORD=your-grafana-password
---
apiVersion: v1
kind: Secret
metadata:
  name: expezplit-secrets
  namespace: expezplit-prod
type: Opaque
data:
  # Base64-encode your actual values:
  #   echo -n "your-email@gmail.com" | base64
  EMAIL: REPLACE_WITH_BASE64_ENCODED_VALUE
  APP_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
  EXCHANGE_RATE_API_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE
  # Optional:
  # SENTRY_DSN: REPLACE_WITH_BASE64_ENCODED_VALUE
  # GRAFANA_ADMIN_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
  # KAFKA_BROKERS: REPLACE_WITH_BASE64_ENCODED_VALUE
